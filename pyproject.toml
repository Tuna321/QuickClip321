[build-system]
requires = ["setuptools==84.2.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quickclip321"
version = "2.1.0rc2"
description = "Reliable tray-based media downloader for Windows"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "customtkinter>=5.2.2,<6",
  "Pillow>=11,<13",
  "plyer>=2.1,<3",
  "pystray>=0.19.5,<1",
  "yt-dlp[default]>=2026.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.15,<7", "ruff>=0.12,<1"]

[project.scripts]
quickclip321 = "quickclip321.main:main"

[tool.setuptools.packages.find]
include = ["quickclip321*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
