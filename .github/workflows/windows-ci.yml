name: Windows CI
on:
  push:
    branches: [main, 'improvements/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QUICKCLIP321_DATA_DIR: ${{ runner.temp }}\quickclip321-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-test-lock.txt
      - name: Install media tools
        run: choco install ffmpeg --yes --no-progress
      - name: Check media tools
        run: |
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint
        run: python -m ruff check quickclip321 tests tools
      - name: Tests
        run: python -m pytest -q -rs --basetemp "${{ runner.temp }}\quickclip321-pytest" 
